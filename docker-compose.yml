# docker-compose.yml
# KindPDF — self-hosting configuration
#
# Starts three services:
#   backend   — Flask/Gunicorn API (port 5000)
#   frontend  — React app served by nginx (port 3000 → container 80)
#   db        — PostgreSQL database (port 5432, internal only for now)
#
# Usage:
#   docker compose up --build   (first run or after code changes)
#   docker compose up           (subsequent runs, uses cached images)
#   docker compose down         (stop and remove containers)
#   docker compose down -v      (also remove stored data — use with care)

services:

  # ── Flask / Gunicorn backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kindpdf-backend
    restart: unless-stopped
    ports:
      # Optional: exposes the API directly on the host for debugging.
      # Normal browser traffic reaches the backend through nginx (/api/ proxy),
      # NOT through this port — so this can be removed in a production deployment.
      - "5000:5000"
    environment:
      FLASK_ENV: production
      # Database URL — used when database features are added in Phase 2.
      DATABASE_URL: postgresql://kindpdf:kindpdf_password@db:5432/kindpdf
    volumes:
      # Named volume keeps uploaded PDFs alive across container restarts.
      - pdf_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kindpdf-net

  # ── React frontend via nginx ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kindpdf-frontend
    restart: unless-stopped
    ports:
      # Access KindPDF in your browser at http://localhost:3000
      - "3000:80"
    depends_on:
      - backend
    networks:
      - kindpdf-net

  # ── PostgreSQL database ───────────────────────────────────────────────────
  # The app does not use the database yet (Phase 1 uses the filesystem).
  # It is included here so the full stack is ready for Phase 2 features
  # (user accounts, saved files, etc.) without any additional setup.
  db:
    image: postgres:16-alpine
    container_name: kindpdf-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kindpdf
      POSTGRES_USER: kindpdf
      POSTGRES_PASSWORD: kindpdf_password
    volumes:
      # Named volume keeps database data alive across container restarts.
      - db_data:/var/lib/postgresql/data
    ports:
      # Exposed on the host for local DB inspection tools (e.g. pgAdmin).
      # Remove this line in a public-facing deployment for tighter security.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kindpdf -d kindpdf"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kindpdf-net

# ── Named volumes ─────────────────────────────────────────────────────────
volumes:
  pdf_uploads:
    driver: local
  db_data:
    driver: local

# ── Internal network ──────────────────────────────────────────────────────
networks:
  kindpdf-net:
    driver: bridge
