# frontend/nginx.conf
# KindPDF — nginx configuration for the frontend container
#
# This file is copied into the container at build time by frontend/Dockerfile.
# It does two jobs:
#
#   1. Serves the compiled React app as static files.
#   2. Proxies every /api/ request to the Flask backend container.
#      "backend" is the service name defined in docker-compose.yml — Docker's
#      internal DNS resolves it to the backend container's IP automatically.
#
# WHY the proxy matters:
#   The React app makes all API calls using relative paths like /api/upload.
#   Without a proxy those requests would hit nginx, which only knows about
#   static files.  The proxy_pass directive forwards them to Flask instead.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Upload size limit ──────────────────────────────────────────────────
    # Allows PDF uploads up to 50 MB.  Without this nginx rejects large files
    # with a 413 "Request Entity Too Large" error before Flask even sees them.
    client_max_body_size 50m;

    # ── API proxy ──────────────────────────────────────────────────────────
    # Forward all /api/* requests to the Flask backend container.
    # proxy_read_timeout covers large file processing (save, merge, etc.).
    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Allow large request bodies through to Flask
        client_max_body_size 50m;
    }

    # ── React app (static files + client-side routing) ────────────────────
    # try_files serves the file if it exists (JS/CSS/images); otherwise it
    # falls back to index.html so React Router handles the URL in the browser.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must never be cached so updates take effect immediately.
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Hashed static assets (JS, CSS, images) ───────────────────────────
    # Create React App hashes filenames on every build, so it is safe to
    # cache them for a long time — the browser will fetch new files whenever
    # the hash changes.
    # The inline types block adds .mjs → application/javascript because
    # nginx's default mime.types does not include it. Without this, the
    # PDF.js worker is served as application/octet-stream and the browser
    # refuses to load it, breaking PDF rendering entirely.
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        types { application/javascript mjs; }
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         DENY;
    add_header Referrer-Policy         no-referrer;
}
